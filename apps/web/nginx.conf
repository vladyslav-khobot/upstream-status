server {
  listen 80;
  root /usr/share/nginx/html;

  # Same-origin API: the browser calls /api and nginx forwards it to the api container.
  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Hashed build assets never change, so they can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Client-side routing: unknown paths (e.g. /services/github) serve the SPA.
  location / {
    try_files $uri /index.html;
  }
}
