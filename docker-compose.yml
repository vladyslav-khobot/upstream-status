# Runs the production builds of both apps: http://localhost:8080
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3001
      CACHE_TTL_MS: 10000
      UPSTREAM_TIMEOUT_MS: 45000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-upstream-admin}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_ADMIN_TOKEN: ${ADMIN_TOKEN:-upstream-admin}
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
